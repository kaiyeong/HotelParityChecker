# Input Property CSV & Provider ID Cache
properties.csv.path=config/google-hotel-list.csv
provider.id.cache.path=config/provider-id-cache.json

# Weekly Scheduler (Quartz Cron: Every Monday at 08:00 AM)
weekly.cron.expression=0 0 8 ? * MON

# Monitoring Window & Parity Threshold
monitoring.start.offset.days=1
monitoring.days.window=30
parity.breach.threshold=1.00

# Concurrency & Rate-Limit Throttling
